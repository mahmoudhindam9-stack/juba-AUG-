name: Apply exact mall contracts and per-item notes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-contract-notes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -e
          git clone --depth 1 https://github.com/mahmoudhindam9-stack/jubaforedit.git /tmp/jubaforedit
          cp /tmp/jubaforedit/src/shared/services/mallContractTemplates.ts src/shared/services/mallContractTemplates.ts
          cp /tmp/jubaforedit/src/routes/admin/mall.tsx src/routes/admin/mall.tsx
          python - <<'PY'
          from pathlib import Path
          import re
          def insert_after(path, pattern, text, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              m=re.search(pattern,s)
              if not m: raise SystemExit(label+' anchor missing')
              pos=m.end(); p.write_text(s[:pos]+text+s[pos:],encoding='utf-8')
          # Captain modal per-item notes.
          p=Path('src/components/TableOrderModal.tsx'); s=p.read_text(encoding='utf-8')
          if 'const updateItemNotes = (id: string, notes: string)' not in s:
              insert_after('src/components/TableOrderModal.tsx',r'const removeFromCart = \(id: string\).*?\n', '''\n\n  const updateItemNotes = (id: string, notes: string) => {\n    setCart((prev) => prev.map((c) => (c.item.id === id ? { ...c, notes } : c)));\n  };''','Captain note handler')
          p=Path('src/components/TableOrderModal.tsx'); s=p.read_text(encoding='utf-8')
          if 'placeholder={lang === "ar" ? "ملاحظة لهذا الصنف..."' not in s:
              anchor=r'(<h5 className="font-bold text-xs text-slate-800 truncate">\s*\{line\.item\.name_ar\}\s*</h5>)'
              repl=r'''\1\n                      <textarea rows={1} value={line.notes || ""} onChange={(e) => updateItemNotes(line.item.id, e.target.value)} placeholder={lang === "ar" ? "ملاحظة لهذا الصنف..." : "Note for this item..."} className="w-full mt-1 bg-white border border-slate-200 rounded-lg px-2 py-1 text-[10px] font-semibold outline-none focus:border-indigo-500 resize-none" />'''
              s,n=re.subn(anchor,repl,s,count=1)
              if n!=1: raise SystemExit('Captain item UI anchor missing')
          s=s.replace('''              quantity: c.quantity,\n              requires_oven: c.item.requires_oven || false,''','''              quantity: c.quantity,\n              notes: c.notes || "",\n              requires_oven: c.item.requires_oven || false,''',1)
          s=re.sub(r'\n              /\* Order Notes \*/.*?\n\n              /\* Calculation Breakdown \*/', '\n              {/* Calculation Breakdown */}', s, count=1, flags=re.S)
          s=s.replace('''      notes: orderNotes,\n      selectedAdditions,''','''      notes: "",\n      selectedAdditions,''')
          p.write_text(s,encoding='utf-8')
          # Cashier POS per-item notes and persistence.
          p=Path('src/routes/pos.tsx'); s=p.read_text(encoding='utf-8')
          if 'const updateItemNotes = (id: string, notes: string)' not in s:
              insert_after('src/routes/pos.tsx',r'const removeFromCart = \(id: string\).*?\n', '''\n\n  const updateItemNotes = (id: string, notes: string) => {\n    setCart((prev) => prev.map((c) => (c.item.id === id ? { ...c, notes } : c)));\n  };''','POS note handler')
          p=Path('src/routes/pos.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('''              quantity: c.quantity,\n              requires_oven: (c.item as any).requires_oven || false,''','''              quantity: c.quantity,\n              notes: c.notes || "",\n              requires_oven: (c.item as any).requires_oven || false,''',1)
          s=s.replace('''      pOrder.items.map((cartItem: any) => ({\n        item: cartItem.item,\n        quantity: cartItem.quantity,\n      }))''','''      pOrder.items.map((cartItem: any) => ({\n        item: cartItem.item,\n        quantity: cartItem.quantity,\n        notes: cartItem.notes || "",\n        selectedAdditions: cartItem.selectedAdditions || [],\n      }))''',1)
          if 'placeholder={lang === "ar" ? "ملاحظة لهذا الصنف..."' not in s:
              anchor=r'(<h5 className="font-bold text-sm line-clamp-1">\{c\.item\.name_ar\}</h5>)'
              repl=r'''\1\n                    <textarea rows={1} value={c.notes || ""} onChange={(e) => updateItemNotes(c.item.id, e.target.value)} placeholder={lang === "ar" ? "ملاحظة لهذا الصنف..." : "Note for this item..."} className="w-full mt-1 bg-background border border-border rounded-lg px-2 py-1 text-[11px] font-semibold outline-none focus:border-primary resize-none" />'''
              s,n=re.subn(anchor,repl,s,count=1)
              if n!=1: raise SystemExit('POS item UI anchor missing')
          p.write_text(s,encoding='utf-8')
          # Oven: show item notes. Prices/currency remain absent from the KDS line.
          p=Path('src/routes/oven.tsx'); s=p.read_text(encoding='utf-8')
          if 'item.notes' not in s:
              for anchor,repl in [
                (r'(<span className="font-bold">\{item\.name_ar\}</span>)',r'''\1\n                        {item.notes && <div className="mt-1 text-xs font-semibold text-amber-700">📝 {item.notes}</div>}'''),
                (r'(<div className="font-bold text-sm">\{item\.name_ar\}</div>)',r'''\1\n                        {item.notes && <div className="mt-1 text-xs font-semibold text-amber-700">📝 {item.notes}</div>}''')]:
                  s,n=re.subn(anchor,repl,s,count=1)
                  if n: break
          p.write_text(s,encoding='utf-8')
          PY
          npm ci
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/mall.tsx src/shared/services/mallContractTemplates.ts src/components/TableOrderModal.tsx src/routes/pos.tsx src/routes/oven.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore exact mall contracts and per-item notes [auto-contract-notes]'
          git push
          git rm .github/workflows/apply-contracts-and-item-notes.yml
          git commit -m 'chore: remove temporary repair workflow [auto-contract-notes]'
          git push
