name: Fix restaurant cross-page flow

on:
  push:
    branches: [fix/restaurant-cross-page-flow]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[auto-restaurant-flow]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply flow fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  print('already patched/missing:', label)
                  return
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('patched:', label)

          # Customer menu -> durable DB order before Captain broadcast.
          replace_once(
              'src/routes/menu.tsx',
              '      created_at: new Date().toISOString(),\n    };\n\n    // Broadcast the order to the Captain via Supabase Realtime Channels',
              '      created_at: new Date().toISOString(),\n    };\n\n    // Persist the same order so Captain, Cashier and Oven share one durable identity.\n    try {\n      const { error } = await supabase.from("orders").upsert({\n        id: orderPayload.id,\n        table_id: orderPayload.table_id,\n        items: orderPayload.items,\n        order_type: orderPayload.order_type,\n        notes: orderPayload.notes,\n        subtotal: Number(orderPayload.subtotal || 0),\n        tax: Number(orderPayload.tax || 0),\n        total: Number(orderPayload.total || 0),\n        status: "pending_captain",\n        created_at: orderPayload.created_at,\n      }, { onConflict: "id" });\n      if (error) throw error;\n    } catch (error) {\n      console.warn("Self-order database bridge warning:", error);\n    }\n\n    // Broadcast the order to the Captain via Supabase Realtime Channels',
              'persist self-order before captain broadcast',
          )

          # Captain -> Cashier must persist the status for cross-device visibility.
          replace_once(
              'src/routes/captain.tsx',
              '  const handleAcceptOrder = async (order: any) => {\n    // We update status in supabase so it moves to kitchen / cashier depending on flow\n    // Or we can import it into local tableOrdersStore if Cashier only reads from there\n    // If cashier reads from tableOrdersStore, we inject it:',
              '  const handleAcceptOrder = async (order: any) => {\n    if (order?.id) {\n      const { error } = await supabase\n        .from("orders")\n        .update({ status: "sent_to_cashier" })\n        .eq("id", order.id);\n      if (error) {\n        toast({ title: "تعذر إرسال الطلب للكاشير", description: error.message, variant: "destructive" });\n        return;\n      }\n    }\n\n',
              'persist Captain acceptance',
          )

          # Live Cashier invalidation when Captain changes the shared order.
          replace_once(
              'src/routes/cashier-treasury.tsx',
              '    enabled: isMounted,\n  });\n\n  const [isSyncing, setIsSyncing] = useState(false);',
              '    enabled: isMounted,\n  });\n\n  useEffect(() => {\n    if (!isMounted) return;\n    const channel = supabase\n      .channel("cashier_orders_bridge")\n      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => {\n        queryClient.invalidateQueries({ queryKey: ["cashier-treasury", "orders"] });\n      })\n      .subscribe();\n    return () => {\n      supabase.removeChannel(channel);\n    };\n  }, [isMounted, queryClient]);\n\n  const [isSyncing, setIsSyncing] = useState(false);',
              'live Cashier order bridge',
          )

          # Receipt invariant: POS already carries the exact totals/tax/currency fields.
          receipt = Path('src/routes/pos.tsx').read_text(encoding='utf-8')
          required = [
              'const displaySubtotal',
              'const displayTax',
              'const displayTotal',
              'currency,',
              'taxRate: invoice.tax_rate ?? receiptSettings.defaultTaxRate',
          ]
          missing = [x for x in required if x not in receipt]
          if missing:
              raise SystemExit('Receipt invariant failed: ' + ', '.join(missing))
          print('PASS: receipt value invariants')

          # Oven bridge invariant already lives in the repository.
          oven = Path('src/routes/oven.tsx').read_text(encoding='utf-8')
          for needle in ['oven_orders_channel', 'NEW_OVEN_ORDER', 'from("orders")']:
              if needle not in oven:
                  raise SystemExit('Oven bridge invariant failed: ' + needle)
          print('PASS: oven bridge invariants')

      - name: Verify
        run: |
          npm ci
          npm run build
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/menu.tsx src/routes/captain.tsx src/routes/cashier-treasury.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore captain cashier oven receipt flow [auto-restaurant-flow]"
          git push
