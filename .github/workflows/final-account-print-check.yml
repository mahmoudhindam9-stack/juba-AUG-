name: Final account print check
on:
  push:
    branches: [fix/external-order-currency-tracking]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch account statement print
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/accounts.tsx')
          s = p.read_text(encoding='utf-8')
          if 'printAccountingDocument' not in s:
              anchor = 'import { useSettings } from "@/hooks/use-settings";\n'
              s = s.replace(anchor, anchor + 'import { printAccountingDocument } from "@/shared/utils/printAccountingDocument";\n', 1)
          old = 'onClick={() => window.print()}'
          new = '''onClick={() => printAccountingDocument({
                    title: `كشف حساب — ${ledgerData.account?.name_ar || ""}`,
                    subtitle: `الحساب ${ledgerData.account?.code || ""} | دفتر الأستاذ العام`,
                    documentNo: `ACCOUNT-${ledgerData.account?.code || "NA"}`,
                    columns: [
                      { key: "date", label: "التاريخ" },
                      { key: "reference", label: "رقم المرجع" },
                      { key: "description", label: "البيان" },
                      { key: "debit", label: "مدين", align: "left" },
                      { key: "credit", label: "دائن", align: "left" },
                      { key: "runningBalance", label: "الرصيد التراكمي", align: "left" },
                    ],
                    rows: (ledgerData.entries || []).map((entry) => ({
                      date: entry.date || "-",
                      reference: entry.reference || entry.id || "-",
                      description: entry.description || "-",
                      debit: entry.debit > 0 ? entry.debit.toLocaleString("en-US") : "-",
                      credit: entry.credit > 0 ? entry.credit.toLocaleString("en-US") : "-",
                      runningBalance: Number(entry.runningBalance || 0).toLocaleString("en-US"),
                    })),
                    totals: [
                      { label: "عدد الحركات", value: String((ledgerData.entries || []).length) },
                      { label: "الرصيد الحالي", value: Number(ledgerData.account?.balance || 0).toLocaleString("en-US") },
                    ],
                  })}'''
          if old not in s:
              raise SystemExit('account print button target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and build
        run: |
          grep -q 'printAccountingDocument' src/routes/admin/accounts.tsx
          grep -q 'كشف حساب —' src/routes/admin/accounts.tsx
          npm ci
          npm run typecheck
          npm run build
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/accounts.tsx
          git commit -m "fix: print account statement from dedicated document" || true
          git push
          git rm -f .github/workflows/final-account-print-check.yml || true
          git diff --cached --quiet || git commit -m "chore: remove account print verification workflow"
          git push || true
