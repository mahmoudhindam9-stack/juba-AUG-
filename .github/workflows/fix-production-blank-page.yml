name: Fix production blank page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch root route and admin auth loading
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'import { createFileRoute } from "@tanstack/react-router";\nimport { AdminLayout } from "./admin";\nimport { Route as AdminRoute } from "./admin/index";\n',
              'import { createFileRoute } from "@tanstack/react-router";\nimport { Route as LoginRoute } from "./login";\n',
          )
          old = '''  component: DashboardHome,\n});\n\nfunction DashboardHome() {\n  const Dashboard = AdminRoute.options.component as React.ElementType;\n  return (\n    <AdminLayout>\n      <Dashboard />\n    </AdminLayout>\n  );\n}\n'''
          new = '''  component: HomeLogin,\n});\n\nfunction HomeLogin() {\n  const Login = LoginRoute.options.component as React.ElementType;\n  return <Login />;\n}\n'''
          if old not in s:
              raise SystemExit('index route patch target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('src/routes/admin.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '  const [user, setUser] = useState<{ email?: string } | null>(null);\n  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);',
              '  const [user, setUser] = useState<{ email?: string } | null>(null);\n  const [authChecking, setAuthChecking] = useState(true);\n  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);',
              1,
          )
          s = s.replace(
              '''      if (session?.user?.email) {\n        setUser({ email: session.user.email });\n      } else if (localUser) {\n        setUser({ email: localUser });\n      } else {\n        navigate({ to: "/login" });\n      }\n    }\n\n    checkAuth();''',
              '''      try {\n        const {\n          data: { session },\n        } = await supabase.auth.getSession();\n\n        if (session?.user?.email) {\n          setUser({ email: session.user.email });\n        } else if (localUser) {\n          setUser({ email: localUser });\n        } else {\n          navigate({ to: "/login" });\n          return;\n        }\n      } catch (error) {\n        console.error("Restocash auth check failed:", error);\n        if (localUser) {\n          setUser({ email: localUser });\n        } else {\n          navigate({ to: "/login" });\n          return;\n        }\n      } finally {\n        setAuthChecking(false);\n      }\n    }\n\n    const localUser = localStorage.getItem("restocash_auth_user");\n    checkAuth();''',
              1,
          )
          s = s.replace(
              '  if (!user) return null;\n',
              '''  if (authChecking) {\n    return (\n      <div className="min-h-screen flex items-center justify-center bg-background p-6" dir="rtl">\n        <div className="w-full max-w-sm rounded-2xl border border-border bg-card p-6 text-center shadow-sm">\n          <RestocashLogo size={32} />\n          <p className="mt-4 text-sm font-bold text-foreground">جاري التحقق من جلسة الدخول…</p>\n          <p className="mt-2 text-xs text-muted-foreground">يرجى الانتظار لحظات.</p>\n        </div>\n      </div>\n    );\n  }\n\n  if (!user) return null;\n''',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run verify:cleanup
          npm run verify:financial
          npm run verify:journal

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx src/routes/admin.tsx package-lock.json
          git diff --cached --quiet || git commit -m 'fix: render login at root and prevent blank admin shell'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-production-blank-page.yml
          git commit -m 'chore: remove one-time production blank-page workflow'
          git push
