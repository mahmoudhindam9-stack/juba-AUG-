name: Dashboard accounting UX refactor

on:
  push:
    branches:
      - fix/external-order-currency-tracking

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/admin/index.tsx')
          s = path.read_text(encoding='utf-8')

          # Import reusable audit modal once.
          if '@/components/admin/AuditOperationsModal' not in s:
              s = s.replace(
                  'import { inventoryService } from "@/features/inventory/services/inventoryService";\n',
                  'import { inventoryService } from "@/features/inventory/services/inventoryService";\nimport { AuditOperationsModal } from "@/components/admin/AuditOperationsModal";\n',
                  1,
              )

          # Open the audit log as an independent window/modal instead of a tab.
          if 'const [isAuditOperationsOpen' not in s:
              s = s.replace(
                  '  const [activeTab, setActiveTab] = useState(tabParam);\n',
                  '  const [activeTab, setActiveTab] = useState(tabParam === "audit_logs" ? "dashboard" : tabParam);\n  const [isAuditOperationsOpen, setIsAuditOperationsOpen] = useState(false);\n',
                  1,
              )
          s = s.replace(
              '      setActiveTab(tabParam);\n',
              '      setActiveTab(tabParam === "audit_logs" ? "dashboard" : tabParam);\n',
              1,
          )

          # Add one source-of-truth accounting snapshot from the same ERP store used by Accounts/Ledger.
          marker = '  // Handle Voucher Submission\n'
          if 'const accountingSummary = useMemo' not in s:
              block = r'''  const accountingSummary = useMemo(() => {
    const accounts = erpState.accounts || [];
    const sumType = (type) => accounts
      .filter((a) => a.type === type)
      .reduce((sum, a) => sum + Number(a.balance || 0), 0);
    const sumByName = (pattern) => accounts
      .filter((a) => pattern.test(String(a.name_ar || "")))
      .reduce((sum, a) => sum + Number(a.balance || 0), 0);

    const totalAssets = sumType("asset");
    const totalLiabilities = sumType("liability");
    const totalEquity = sumType("equity");
    const totalRevenues = sumType("revenue");
    const totalExpenses = sumType("expense");
    const cashAccounts = sumByName(/خزينة|صندوق|نقد|cash/i);
    const bankAccounts = sumByName(/بنك|مصرف|bank/i);
    const inventoryAccounts = sumByName(/مخزون|مخازن|inventory|stock/i);

    const journalEntries = erpState.journalEntries || [];
    let debitTotal = 0;
    let creditTotal = 0;
    let unbalancedEntries = 0;
    journalEntries.forEach((entry) => {
      const debit = (entry.lines || []).reduce((sum, line) => sum + Number(line.debit || 0), 0);
      const credit = (entry.lines || []).reduce((sum, line) => sum + Number(line.credit || 0), 0);
      debitTotal += debit;
      creditTotal += credit;
      if (Math.abs(debit - credit) > 0.01) unbalancedEntries += 1;
    });

    return {
      totalAssets,
      totalLiabilities,
      totalEquity,
      totalRevenues,
      totalExpenses,
      netResult: totalRevenues - totalExpenses,
      cash: cashAccounts || totalCashBalance,
      bank: bankAccounts || totalBankBalance,
      inventory: inventoryAccounts || Number(s?.inventoryValue || 0),
      journalCount: journalEntries.length,
      debitTotal,
      creditTotal,
      unbalancedEntries,
      accountCount: accounts.length,
    };
  }, [erpState.accounts, erpState.journalEntries, totalCashBalance, totalBankBalance, s?.inventoryValue]);

'''
              if marker not in s:
                  raise SystemExit('dashboard marker not found')
              s = s.replace(marker, block + marker, 1)

          # Rewire the existing executive cards to the accounting source of truth.
          s = s.replace('value={formatPrice(s?.revenue || 0)}', 'value={formatPrice(accountingSummary.totalRevenues || 0)}', 1)
          s = s.replace('subtext="مبيعات تشغيلية مباشرة"', 'subtext="من دليل الحسابات المحاسبي"', 1)
          s = s.replace('trend={s?.revenue ? "+14.2% اليوم" : "لا توجد مبيعات"}', 'trend={accountingSummary.totalRevenues ? "متزامن مع حساب الأستاذ" : "لا توجد إيرادات"}', 1)
          s = s.replace('value={formatPrice(totalCashBalance)}', 'value={formatPrice(accountingSummary.cash || 0)}', 1)
          s = s.replace('subtext="السيولة المتوفرة بالصناديق"', 'subtext="الرصيد المحاسبي للخزائن النقدية"', 1)
          s = s.replace('value={formatPrice(totalBankBalance)}', 'value={formatPrice(accountingSummary.bank || 0)}', 1)
          s = s.replace('subtext="إجمالي حسابات البنوك المعتمدة"', 'subtext="حسابات البنوك الظاهرة في دليل الحسابات"', 1)
          s = s.replace('trend="CIB بنك مصر"', 'trend={accountingSummary.bank ? "متزامن مع الحسابات" : "لا توجد حسابات بنكية"}', 1)
          s = s.replace('value={formatPrice(s?.inventoryValue || 0)}', 'value={formatPrice(accountingSummary.inventory || 0)}', 1)

          # Add accounting-focused cards immediately after the executive grid.
          if 'data-dashboard-accounting-sync' not in s:
              needle = '              </div>\n              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">'
              add = '''              </div>
              <div data-dashboard-accounting-sync className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                <StatCard title="صافي النتيجة" value={formatPrice(accountingSummary.netResult || 0)} subtext="الإيرادات ناقص المصروفات" icon={TrendingUp} trend="حسابي مباشر" trendType={accountingSummary.netResult >= 0 ? "up" : "neutral"} accentColor={accountingSummary.netResult >= 0 ? "green" : "primary"} />
                <StatCard title="إجمالي المصروفات" value={formatPrice(accountingSummary.totalExpenses || 0)} subtext="من دليل المصروفات" icon={FileBarChart} trend="متزامن" trendType="neutral" accentColor="amber" />
                <StatCard title="حركات دفتر الأستاذ" value={accountingSummary.journalCount.toLocaleString("en-US")} subtext="عدد القيود المحاسبية" icon={BookOpen} trend={accountingSummary.unbalancedEntries ? `${accountingSummary.unbalancedEntries} غير متزن` : "كل القيود متزنة"} trendType={accountingSummary.unbalancedEntries ? "neutral" : "up"} accentColor={accountingSummary.unbalancedEntries ? "primary" : "green"} />
                <StatCard title="إجمالي الأصول" value={formatPrice(accountingSummary.totalAssets || 0)} subtext={`دليل الحسابات · ${accountingSummary.accountCount.toLocaleString("en-US")} حساب`} icon={Building} trend="المصدر المحاسبي" trendType="neutral" accentColor="blue" />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <Card className="border-border bg-gradient-to-br from-background to-muted/20">
                  <CardContent className="p-5"><div className="text-xs font-bold text-muted-foreground">الأصول</div><div className="mt-1 text-2xl font-black">{formatPrice(accountingSummary.totalAssets || 0)}</div></CardContent>
                </Card>
                <Card className="border-border bg-gradient-to-br from-background to-muted/20">
                  <CardContent className="p-5"><div className="text-xs font-bold text-muted-foreground">الالتزامات</div><div className="mt-1 text-2xl font-black">{formatPrice(accountingSummary.totalLiabilities || 0)}</div></CardContent>
                </Card>
                <Card className="border-border bg-gradient-to-br from-background to-muted/20">
                  <CardContent className="p-5"><div className="text-xs font-bold text-muted-foreground">حقوق الملكية</div><div className="mt-1 text-2xl font-black">{formatPrice(accountingSummary.totalEquity || 0)}</div></CardContent>
                </Card>
              </div>
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 rounded-2xl border border-border bg-white p-4 shadow-xs">
                <div><div className="font-black text-sm">المصادر المحاسبية متزامنة</div><div className="text-xs text-muted-foreground mt-1">لوحة التحكم ← دليل الحسابات ← حساب الأستاذ والخزائن</div></div>
                <div className="flex gap-2"><Badge variant="outline" className="font-bold"><CheckCircle size={14} className="ml-1" /> مزامنة مباشرة</Badge><Badge variant="outline" className="font-bold">مدين {accountingSummary.debitTotal.toLocaleString("en-US", { maximumFractionDigits: 2 })}</Badge><Badge variant="outline" className="font-bold">دائن {accountingSummary.creditTotal.toLocaleString("en-US", { maximumFractionDigits: 2 })}</Badge></div>
              </div>'''
              if needle not in s:
                  # Fallback: add directly before the next dashboard section after the first executive grid.
                  pos = s.find('              {/*')
                  if pos < 0:
                      raise SystemExit('executive grid insertion point not found')
              else:
                  s = s.replace(needle, add + '\n              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">', 1)

          # Turn the audit tab trigger into a modal opener.
          old_trigger = '''          <TabsTrigger value="audit_logs" className="rounded-lg font-bold py-2 px-4">
            <History size={16} className="ml-1.5 inline" />
            سجل العمليات والرقابة الأمنية
          </TabsTrigger>'''
          new_trigger = '''          <Button type="button" variant="outline" onClick={() => setIsAuditOperationsOpen(true)} className="rounded-lg font-bold py-2 px-4 h-auto">
            <History size={16} className="ml-1.5 inline" />
            سجل العمليات
          </Button>'''
          if old_trigger in s:
              s = s.replace(old_trigger, new_trigger, 1)
          else:
              s = re.sub(r'\s*<TabsTrigger value="audit_logs"[\s\S]*?</TabsTrigger>', '\n' + new_trigger, s, count=1)

          # Remove the old full-page audit tab so it cannot render under the dashboard.
          s = re.sub(r'\n\s*\{\/\* TAB 6: AUDIT LOGS \*\/\}[\s\S]*?<\/TabsContent>', '\n', s, count=1)

          # Mount the new independent modal after the main Tabs component.
          if '<AuditOperationsModal ' not in s:
              tabs_close = '      </Tabs>\n'
              modal = '''      </Tabs>

      <AuditOperationsModal
        open={isAuditOperationsOpen}
        onOpenChange={setIsAuditOperationsOpen}
        logs={erpState.auditLogs || []}
      />
'''
              if tabs_close not in s:
                  raise SystemExit('Tabs close not found')
              s = s.replace(tabs_close, modal, 1)

          # Remove the explicit CIB example from treasury creation text.
          s = s.replace('placeholder="مثال: خزينة المشروبات، CIB دولار"', 'placeholder="مثال: خزينة المشروبات، دولار"', 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate dashboard source
        run: |
          test -f src/components/admin/AuditOperationsModal.tsx
          grep -q "AuditOperationsModal" src/routes/admin/index.tsx
          ! grep -q "CIB بنك مصر" src/routes/admin/index.tsx
      - name: Install and verify
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit result and remove migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/index.tsx src/components/admin/AuditOperationsModal.tsx .github/workflows/dashboard-accounting-ux.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: modernize dashboard and independent operations history"
          git push
          git rm -f .github/workflows/dashboard-accounting-ux.yml || true
          git commit -m "chore: remove dashboard UX migration"
          git push || true
