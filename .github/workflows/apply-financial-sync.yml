name: Apply financial sync fixes
on:
  push:
    branches:
      - audit-import-guards-2026-08-29
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply financial sync patch
        run: node patch_financial_sync_20260829.cjs
      - name: Verify source builds
        run: |
          npm ci
          node scripts/verify-financial-sync.cjs
          npm run build
      - name: Commit source fixes
        run: |
          if git diff --quiet -- src/routes/admin/index.tsx src/routes/admin/ledger.tsx scripts/verify-financial-sync.cjs; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/index.tsx src/routes/admin/ledger.tsx scripts/verify-financial-sync.cjs
          git commit -m "fix: synchronize dashboard balances with general ledger"
          git push origin HEAD:audit-import-guards-2026-08-29
