name: Repair Ledger Sort Syntax

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-import-guards-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node patch_ledger_sort_syntax.cjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/ledger.tsx patch_ledger_sort_syntax.cjs
          git diff --cached --quiet || git commit -m "fix: repair duplicated journal sort syntax"
          git push origin audit-import-guards-2026-08-29
