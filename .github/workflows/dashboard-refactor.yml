name: Integrated restaurant flow refactor

on:
  push:
    branches: [fix/external-order-currency-tracking]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integrated restaurant changes
        run: python3 scripts/finish-external-order-cashier.py
      - name: Verify source
        run: |
          test -f src/components/admin/AuditOperationsModal.tsx
          test -f src/components/CustomerOrderTracker.tsx
          test -f src/components/CaptainSelfOrderPanel.tsx
          grep -q 'data-dashboard-accounting-sync="true"' src/routes/admin/index.tsx
          grep -q 'customer_tracking_token' src/routes/menu.tsx
          grep -q 'CaptainSelfOrderPanel' src/routes/captain.tsx
          grep -q 'ملء من إجمالي مبيعات الشيفت' src/routes/cashier-treasury.tsx
          ! grep -q 'CIB بنك مصر' src/routes/admin/index.tsx
          ! grep -q 'value="audit_logs"' src/routes/admin/index.tsx
      - name: Typecheck and production build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit verified result and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/index.tsx src/components/admin/AuditOperationsModal.tsx src/components/TableOrderModal.tsx src/components/CustomerOrderTracker.tsx src/components/CaptainSelfOrderPanel.tsx src/routes/menu.tsx src/routes/captain.tsx src/routes/cashier-treasury.tsx src/shared/hooks/useTableOrders.ts src/shared/services/translationService.ts supabase/migrations/20260830000000_external_order_payment_tracking.sql scripts/finish-external-order-cashier.py
          git diff --cached --quiet || git commit -m "feat: complete QR order flow and cashier shift autofill"
          git push
          git rm -f .github/workflows/dashboard-refactor.yml .github/workflows/external-order-and-cashier-shift.yml .github/workflows/finish-external-order-cashier.yml .github/workflows/one-time-editor-modal.yml .github/workflows/dashboard-accounting-ux.yml .github/dashboard-refactor-trigger.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: remove temporary migration workflows"
          git push || true
