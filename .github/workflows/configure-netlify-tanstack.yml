name: Configure TanStack Start for Netlify production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install official Netlify TanStack Start adapter
        run: npm install --save-dev @netlify/vite-plugin-tanstack-start@1.3.19

      - name: Configure Vite for Netlify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text(encoding='utf-8')
          if 'from "@netlify/vite-plugin-tanstack-start"' not in s:
              s = s.replace('import tailwindcss from "@tailwindcss/vite";\n', 'import tailwindcss from "@tailwindcss/vite";\nimport netlify from "@netlify/vite-plugin-tanstack-start";\n', 1)
          if '    netlify(),\n' not in s:
              s = s.replace('    tailwindcss(),\n', '    tailwindcss(),\n    netlify(),\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Netlify build output
        run: |
          cat > netlify.toml <<'EOF'
          [build]
            command = "npm run build"
            publish = "dist/client"

          [build.environment]
            NODE_VERSION = "22"
          EOF

      - name: Validate
        run: |
          npm run typecheck
          npm run build
          npm run verify:cleanup
          npm run verify:financial
          npm run verify:journal

      - name: Commit production configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vite.config.ts netlify.toml
          git diff --cached --quiet || git commit -m 'fix: configure TanStack Start for Netlify production'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/configure-netlify-tanstack.yml
          git commit -m 'chore: remove one-time Netlify configuration workflow'
          git push
