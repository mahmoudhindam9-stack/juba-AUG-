name: Repair POS receipt and oven handoff

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-pos-oven-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair receipt totals
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/pos.tsx')
          s = p.read_text(encoding='utf-8')

          # The database order is authoritative, but some adapters/legacy records can
          # return empty financial fields. Rebuild the printable values from the items
          # when a stored value is zero/empty so the receipt can never silently print 0.
          anchor = '''  const handlePrint = () => {\n    const isConnected = printerService.isPrinterConnected();'''
          replacement = '''  const handlePrint = () => {\n    const calculatedItemsSubtotal = itemsList.reduce(\n      (sum, it) => sum + Number(it?.price || 0) * Number(it?.quantity || 0),\n      0,\n    );\n    const printableSubtotal = Number(invoice.subtotal) || calculatedItemsSubtotal;\n    const printableDiscount = Number(invoice.discount) || 0;\n    const printableServiceFee = Number(invoice.service_fee) || 0;\n    const printableDeliveryFee = Number(invoice.delivery_fee) || 0;\n    const printableTax = Number(invoice.tax) || 0;\n    const printableTotal =\n      Number(invoice.total) ||\n      Math.max(\n        0,\n        printableSubtotal -\n          printableDiscount +\n          printableServiceFee +\n          printableDeliveryFee +\n          printableTax,\n      );\n\n    const isConnected = printerService.isPrinterConnected();'''
          if anchor not in s:
              raise SystemExit('InvoiceView handlePrint marker missing')
          if 'const calculatedItemsSubtotal = itemsList.reduce(' not in s:
              s = s.replace(anchor, replacement, 1)

          s = s.replace('''      subtotal: Number(invoice.subtotal),\n      discount: invoice.discount ? Number(invoice.discount) : undefined,\n      serviceFee: invoice.service_fee ? Number(invoice.service_fee) : undefined,\n      deliveryFee: invoice.delivery_fee ? Number(invoice.delivery_fee) : undefined,\n      tax: Number(invoice.tax),''','''      subtotal: printableSubtotal,\n      discount: printableDiscount || undefined,\n      serviceFee: printableServiceFee || undefined,\n      deliveryFee: printableDeliveryFee || undefined,\n      tax: printableTax,''',1)

          s = s.replace('''      total: Number(invoice.total),\n      thankYouMessage:''','''      total: printableTotal,\n      currency,\n      thankYouMessage:''',1)

          # Keep the on-screen invoice consistent with the same fallback values.
          s = s.replace('''  return (\n    <div className="p-8" id="invoice"''','''  const displaySubtotal = Number(invoice.subtotal) || calculatedItemsSubtotal;\n  const displayTax = Number(invoice.tax) || 0;\n  const displayTotal = Number(invoice.total) || Math.max(0, displaySubtotal - Number(invoice.discount || 0) + Number(invoice.service_fee || 0) + Number(invoice.delivery_fee || 0) + displayTax);\n\n  return (\n    <div className="p-8" id="invoice"''',1)
          s = s.replace('formatPrice(Number(invoice.subtotal))', 'formatPrice(displaySubtotal)', 1)
          s = s.replace('formatPrice(Number(invoice.tax))', 'formatPrice(displayTax)', 1)
          s = s.replace('formatPrice(Number(invoice.total))', 'formatPrice(displayTotal)', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/pos.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore POS receipt values [auto-pos-oven-fix]"
          git push
