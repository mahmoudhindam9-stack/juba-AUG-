name: One-time admin editor modal migration
on:
  push:
    branches: [fix/external-order-currency-tracking]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch admin editor UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          patch('src/routes/admin/menu.tsx', [
              ('import {\n  Pencil,', 'import {\n  Pencil,',),
              ('  AlertTriangle,\n} from "lucide-react";', '  AlertTriangle,\n  X,\n} from "lucide-react";'),
              ('  const [editingItem, setEditingItem] = useState<MenuItem | null>(null);', '  const [editingItem, setEditingItem] = useState<MenuItem | null>(null);\n  const [isItemEditorOpen, setIsItemEditorOpen] = useState(false);'),
              ('      setEditingItem(null);\n      setItemForm({', '      setEditingItem(null);\n      setIsItemEditorOpen(false);\n      setItemForm({'),
              ('  const startEditItem = (item: MenuItem) => {\n    setEditingItem(item);', '  const startEditItem = (item: MenuItem) => {\n    setEditingItem(item);\n    setIsItemEditorOpen(true);'),
              ('    window.scrollTo({ top: 0, behavior: "smooth" });\n  };', '  };'),
              ('  const cancelEditItem = () => {', '  const requestCloseItemEditor = () => {\n    const confirmed = window.confirm("لديك تغييرات قد تكون غير محفوظة. هل تريد تجاهلها وإغلاق نافذة التعديل؟");\n    if (confirmed) cancelEditItem();\n  };\n\n  const cancelEditItem = () => {'),
              ('  const cancelEditItem = () => {\n    setEditingItem(null);', '  const cancelEditItem = () => {\n    setEditingItem(null);\n    setIsItemEditorOpen(false);'),
          ])

          # Menu: turn the large editor block into a modal and add a primary Add button.
          p = Path('src/routes/admin/menu.tsx'); s = p.read_text(encoding='utf-8')
          old = '<div className="bg-card border border-border p-5 rounded-2xl space-y-5">'
          new = '<div className={isItemEditorOpen ? "fixed inset-0 z-[70] overflow-y-auto bg-black/60 p-3 sm:p-6" : "hidden"}>\n          <div className="bg-card border border-border p-5 rounded-2xl space-y-5 max-w-6xl mx-auto shadow-2xl">'
          if old not in s: raise SystemExit('menu editor wrapper pattern missing')
          s = s.replace(old, new, 1)
          marker = '<!-- INVALID -->'
          header_old = '''              <h2 className="font-black text-lg text-primary flex items-center gap-2">\n                <ChefHat size={18} />\n                {editingItem\n                  ? `تعديل الصنف: ${editingItem.name_ar}`\n                  : "إضافة صنف مأكولات أو مشروب جديد"}\n              </h2>'''
          header_new = '''              <div className="flex items-center justify-between gap-3">\n                <h2 className="font-black text-lg text-primary flex items-center gap-2">\n                  <ChefHat size={18} />\n                  {editingItem ? `تعديل الصنف: ${editingItem.name_ar}` : "إضافة صنف مأكولات أو مشروب جديد"}\n                </h2>\n                <Button type="button" variant="outline" size="icon" onClick={requestCloseItemEditor} className="rounded-xl shrink-0">\n                  <X size={16} />\n                </Button>\n              </div>'''
          if header_old not in s: raise SystemExit('menu header pattern missing')
          s = s.replace(header_old, header_new, 1)
          footer_old = '''              {editingItem && (\n                <Button variant="outline" onClick={cancelEditItem} className="font-bold">\n                  إلغاء التعديل\n                </Button>\n              )}'''
          footer_new = '''              <Button variant="outline" onClick={requestCloseItemEditor} className="font-bold">\n                تجاهل التعديلات\n              </Button>'''
          if footer_old not in s: raise SystemExit('menu footer pattern missing')
          s = s.replace(footer_old, footer_new, 1)
          # Close the modal wrapper immediately before the catalog comment.
          comment = '          {/* Catalog grid catalog items table view */}'
          if comment not in s: raise SystemExit('menu catalog comment missing')
          s = s.replace(comment, '          </div>\n        </div>\n\n' + comment, 1)
          # Put the add button beside search.
          needle = '              <div className="relative flex-1 max-w-md">'
          add = '''              <Button type="button" onClick={() => { cancelEditItem(); setIsItemEditorOpen(true); }} className="font-bold gap-2 shrink-0">\n                <Plus size={15} /> إضافة صنف جديد\n              </Button>\n''' + needle
          if needle not in s: raise SystemExit('menu search marker missing')
          s = s.replace(needle, add, 1)
          p.write_text(s, encoding='utf-8')

          # Inventory: add modal state and wrap the existing editor block.
          p = Path('src/routes/admin/inventory.tsx'); s = p.read_text(encoding='utf-8')
          replacements = [
              ('  const [editing, setEditing] = useState<Inventory | null>(null);', '  const [editing, setEditing] = useState<Inventory | null>(null);\n  const [isInventoryEditorOpen, setIsInventoryEditorOpen] = useState(false);'),
              ('      setEditing(null);\n      setForm({', '      setEditing(null);\n      setIsInventoryEditorOpen(false);\n      setForm({'),
              ('  const startEdit = (i: Inventory) => {', '  const requestCloseInventoryEditor = () => {\n    const confirmed = window.confirm("لديك تغييرات قد تكون غير محفوظة. هل تريد تجاهلها وإغلاق نافذة التعديل؟");\n    if (confirmed) { setEditing(null); setIsInventoryEditorOpen(false); }\n  };\n\n  const openNewInventoryEditor = () => {\n    setEditing(null);\n    setIsInventoryEditorOpen(true);\n  };\n\n  const startEdit = (i: Inventory) => {\n    setIsInventoryEditorOpen(true);'),
          ]
          for old, new in replacements:
              if old not in s: raise SystemExit(f'inventory pattern missing: {old[:120]!r}')
              s = s.replace(old, new, 1)
          old = '<div className="bg-card border border-border p-5 rounded-2xl space-y-4">'
          new = '<div className={isInventoryEditorOpen ? "fixed inset-0 z-[70] overflow-y-auto bg-black/60 p-3 sm:p-6" : "hidden"}>\n          <div className="bg-card border border-border p-5 rounded-2xl space-y-4 max-w-6xl mx-auto shadow-2xl">'
          if old not in s: raise SystemExit('inventory editor wrapper pattern missing')
          s = s.replace(old, new, 1)
          header_old = '''            <h3 className="font-bold text-base text-primary flex items-center gap-2">\n              <span className="w-2.5 h-2.5 rounded-full bg-primary inline-block"></span>\n              {editing ? `تعديل الصنف المتقدم: ${editing.name_ar}` : "إضافة صنف مخزني متقدم جديد"}\n            </h3>'''
          header_new = '''            <div className="flex items-center justify-between gap-3">\n              <h3 className="font-bold text-base text-primary flex items-center gap-2">\n                <span className="w-2.5 h-2.5 rounded-full bg-primary inline-block"></span>\n                {editing ? `تعديل الصنف المتقدم: ${editing.name_ar}` : "إضافة صنف مخزني متقدم جديد"}\n              </h3>\n              <Button type="button" variant="outline" size="icon" onClick={requestCloseInventoryEditor} className="rounded-xl shrink-0">\n                <X size={16} />\n              </Button>\n            </div>'''
          if header_old not in s: raise SystemExit('inventory header pattern missing')
          s = s.replace(header_old, header_new, 1)
          footer_old = '''              <Button\n                variant="outline"\n                onClick={() => {\n                  setEditing(null);\n                  setForm({\n                    name_ar: "",'''
          # Replace the existing cancel button start through its matching closing before next section using exact block text.
          if footer_old not in s: raise SystemExit('inventory cancel start missing')
          start = s.index(footer_old)
          end_marker = '              </Button>\n            </div>\n          </div>\n\n          {/* Search, Filter, and Table Section */}'
          end = s.find(end_marker, start)
          if end == -1: raise SystemExit('inventory footer end missing')
          block = s[start:end]
          newblock = '''              <Button variant="outline" onClick={requestCloseInventoryEditor} className="font-bold">\n                تجاهل التعديلات\n              </Button>\n'''
          s = s[:start] + newblock + s[end:]
          # Close wrapper before search section comment.
          s = s.replace('          {/* Search, Filter, and Table Section */}', '          </div>\n        </div>\n\n          {/* Search, Filter, and Table Section */}', 1)
          # Add new-item button alongside search field.
          needle = '              <div className="relative flex-1 max-w-md">'
          add = '''              <Button type="button" onClick={openNewInventoryEditor} className="font-bold gap-2 shrink-0">\n                <Plus size={15} /> إضافة صنف جديد\n              </Button>\n''' + needle
          if needle not in s: raise SystemExit('inventory search marker missing')
          s = s.replace(needle, add, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify source and build
        run: |
          test "$(grep -o 'isItemEditorOpen' src/routes/admin/menu.tsx | wc -l)" -ge 4
          test "$(grep -o 'isInventoryEditorOpen' src/routes/admin/inventory.tsx | wc -l)" -ge 4
          npm ci
          npm run build
      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/menu.tsx src/routes/admin/inventory.tsx .github/workflows/one-time-admin-editor-modal.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: use modal editors for menu and inventory"
          git push
