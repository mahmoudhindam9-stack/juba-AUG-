name: Apply import journal fixes

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final financial synchronization patch
        run: node patch_financial_sync_v2_20260829.cjs

      - name: Verify source builds and invariants
        run: |
          npm ci
          node scripts/verify-financial-sync.cjs
          npm run build

      - name: Commit source fixes
        run: |
          if git diff --quiet -- src/shared/services/erpStore.ts src/shared/utils/oracleParser.ts src/routes/admin/ledger.tsx src/routes/admin/index.tsx scripts/verify-financial-sync.cjs; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/services/erpStore.ts src/shared/utils/oracleParser.ts src/routes/admin/ledger.tsx src/routes/admin/index.tsx scripts/verify-financial-sync.cjs
          git commit -m "fix: finalize journal numbering and ledger synchronization"
          git push origin HEAD:audit-import-guards-2026-08-29
