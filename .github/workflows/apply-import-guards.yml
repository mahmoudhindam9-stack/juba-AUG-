name: Apply import journal fixes

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final journal display ordering
        run: node patch_journal_sort_v6_20260829.cjs

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/ledger.tsx
          if git diff --cached --quiet; then
            echo "No journal ordering changes required."
          else
            git commit -m "fix: order journal display by year month journal sequence"
          fi
          git pull --rebase origin audit-import-guards-2026-08-29
          git push origin HEAD:audit-import-guards-2026-08-29
