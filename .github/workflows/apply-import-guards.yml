name: Final journal import verification

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production build verification
        run: |
          npm ci
          npm run build
