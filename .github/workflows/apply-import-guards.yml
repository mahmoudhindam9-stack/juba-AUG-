name: Apply import journal fixes

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stable financial synchronization patch
        run: |
          node patch_financial_sync_v4_20260829.cjs
          node patch_journal_sort_v5_20260829.cjs

      - name: Commit source fixes
        run: |
          if git diff --quiet -- src/shared/services/erpStore.ts src/shared/utils/oracleParser.ts src/shared/utils/oracleJournalGrouping.ts src/routes/admin/ledger.tsx src/routes/admin/index.tsx; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/services/erpStore.ts src/shared/utils/oracleParser.ts src/shared/utils/oracleJournalGrouping.ts src/routes/admin/ledger.tsx src/routes/admin/index.tsx
          git commit -m "fix: finalize Oracle numbering and dashboard ledger sync"
          git push origin HEAD:audit-import-guards-2026-08-29
