name: Apply import journal fixes

on:
  push:
    branches:
      - audit-import-guards-2026-08-29

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ERP journal validation
        run: node patch_erp_validation.cjs

      - name: Apply Oracle journal grouping fix
        run: node patch_oracle_2021_import.cjs

      - name: Apply durable journal persistence
        run: node patch_journal_persistence.cjs

      - name: Apply ledger async save and truthful import errors
        run: node patch_ledger_persistence.cjs

      - name: Commit source fixes
        run: |
          if git diff --quiet -- src/shared/services/erpStore.ts src/shared/utils/oracleParser.ts src/routes/admin/ledger.tsx; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/services/erpStore.ts src/shared/utils/oracleParser.ts src/routes/admin/ledger.tsx
          git commit -m "fix: complete Oracle import and journal persistence flow"
          git push origin HEAD:audit-import-guards-2026-08-29
