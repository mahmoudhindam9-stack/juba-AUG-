name: Repair current main and verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair missing runtime icon imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/cashier-treasury.tsx')
          s = p.read_text(encoding='utf-8')
          if '  FileText,\n' not in s:
              s = s.replace('  FileSpreadsheet,\n', '  FileSpreadsheet,\n  FileText,\n', 1)
          if '  Printer,\n' not in s:
              s = s.replace('  Zap,\n', '  Zap,\n  Printer,\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify repair markers and existing fixes
        run: |
          grep -q 'import { printAccountingDocument }' src/routes/cashier-treasury.tsx
          grep -q '  FileText,' src/routes/cashier-treasury.tsx
          grep -q '  Printer,' src/routes/cashier-treasury.tsx
          grep -q 'طباعة الشيفت' src/routes/cashier-treasury.tsx
          grep -q 'طباعة الفترة' src/routes/cashier-treasury.tsx
          grep -q 'Excel للفترة' src/routes/cashier-treasury.tsx
          test -f src/shared/utils/printAccountingDocument.ts
          grep -q 'printLedgerDocument' src/routes/admin/ledger.tsx
          grep -q 'exportLedgerDocumentToExcel' src/routes/admin/ledger.tsx
          grep -q 'getCanonicalAccountDefinition' src/shared/services/erpStore.ts
          grep -q 'ensureJournalAccounts' src/shared/services/erpStore.ts
          grep -q 'Oracle journal identity is YEAR + MONTH + JOURNAL NUMBER' src/shared/utils/oracleJournalGrouping.ts

      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run verify:cleanup
          npm run verify:financial
          npm run verify:journal

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cashier-treasury.tsx
          git diff --cached --quiet || git commit -m 'fix: restore cashier print icon imports'
          git push

      - name: Remove one-time repair workflow
        run: |
          git rm .github/workflows/repair-current.yml
          git commit -m 'chore: remove one-time repair workflow'
          git push
