name: Apply and verify unified dashboard refactor

on:
  push:
    branches: [fix/external-order-currency-tracking]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply unified dashboard changes
        run: python3 scripts/apply-unified-dashboard.py
      - name: Verify source wiring
        run: |
          test -f src/components/admin/UnifiedFinancialOverview.tsx
          grep -q 'UnifiedFinancialOverview' src/routes/admin/index.tsx
          grep -q 'onOpenOperations' src/routes/admin/index.tsx
          grep -q 'tokens.every' src/components/admin/AuditOperationsModal.tsx
          ! grep -qi 'البنك الرئيسي (CIB)' src/routes/admin/index.tsx
      - name: Typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit and clean temporary tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/index.tsx src/components/admin/UnifiedFinancialOverview.tsx src/components/admin/AuditOperationsModal.tsx scripts/apply-unified-dashboard.py .github/workflows/apply-unified-dashboard.yml
          git diff --cached --quiet || git commit -m "feat: modernize unified financial dashboard"
          git push
